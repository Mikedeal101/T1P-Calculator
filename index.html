
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Price Calculator</title>

<link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>

<style>
:root {
  --system-blue: #007aff;
  --system-gray: #ececec;
  --corner-radius: 12px;
  --spacing: 16px;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html,body { margin:0; padding:0; }
body { font-family: var(--font-body); background:#fff; color:#000;
       max-width:460px; margin:0 auto; padding:calc(var(--spacing)*2) var(--spacing);}
h1 { font-size:28px; font-weight:700; text-align:center; margin:0 0 var(--spacing) 0; line-height:1.2;}
label { display:block; font-size:17px; font-weight:600; margin-bottom:6px; }
input[type="number"]{width:100%; padding:14px 12px; font-size:17px; border:1px solid #c7c7c7;
                     border-radius:var(--corner-radius); background:var(--system-gray); appearance:none;}
input[type="number"]:focus{outline:none; border-color:var(--system-blue);
                           box-shadow:0 0 0 2px rgba(0,122,255,0.2);}
button{width:100%; padding:14px 0; margin-top:calc(var(--spacing)*1.5); font-size:17px; font-weight:600;
       border:none; border-radius:var(--corner-radius); background:var(--system-blue); color:#fff; cursor:pointer;
       transition:opacity .15s ease;}
button:active{opacity:.85;}
.result{margin-top:calc(var(--spacing)*1.5); padding:var(--spacing); font-size:17px; font-weight:600;
        background:#fafafa; border:1px solid #e1e1e1; border-radius:var(--corner-radius); min-height:68px;}
@media (prefers-color-scheme: dark){
  body{background:#000;color:#fff;}
  input[type="number"]{background:#1c1c1e;border-color:#3a3a3c;color:#fff;}
  .result{background:#1c1c1e;border-color:#3a3a3c;}
}
</style>
</head>
<body>
  <h1>Paint Price Calculator</h1>

  <div style="margin-bottom: var(--spacing);">
    <label for="days">Days on‑site</label>
    <input id="days" type="number" min="0" step="1" placeholder="e.g. 2">
  </div>

  <div>
    <label for="gallons">Gallons of paint</label>
    <input id="gallons" type="number" min="0" step="0.01" placeholder="e.g. 29">
  </div>

  <button id="calcBtn">Calculate</button>

  <div class="result" id="output">Enter values and tap Calculate</div>

<script>
document.getElementById('calcBtn').addEventListener('click',() => {
  const days = parseFloat(document.getElementById('days').value) || 0;
  const gallons = parseFloat(document.getElementById('gallons').value) || 0;

  const baseTotal = (days * 600) + (gallons * 28.38) + 100; // + prep materials
  const grandTotal = baseTotal * 2; // 50% margin → double

  document.getElementById('output').innerHTML =
    'Base total (labor + paint + prep materials): $' + baseTotal.toFixed(2) + '<br>' +
    'Total with 50% margin: <span style="color:var(--system-blue)">$' + grandTotal.toFixed(2) + '</span>';
});
</script>
</body>
</html>
